<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/es/">
  <link rel="canonical" href="https://republica-esperanza-oscuro.pages.dev/es/">
  <title>República de Esperanza — MSR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, rgba(76,175,80,0.12), transparent 35%),
                  linear-gradient(180deg, #111, #0d0d0d);
      color: #eaeaea;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .box {
      max-width: 520px;
    }
    .estrella {
      width: 72px;
      height: 72px;
      background: #C62828;
      margin: 0 auto 1.5rem;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      box-shadow: 0 0 24px rgba(198,40,40,0.5);
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.2em;
      color: #F5F5F5;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    p {
      color: #b8b8b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 0.8rem;
    }
    a {
      color: #4CAF50;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid #4CAF50;
    }
    a:hover { color: #E53935; border-color: #E53935; }
    .langs {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .langs a {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      color: #F5F5F5;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
    }
    .langs a:hover {
      background: #C62828;
      border-color: #C62828;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="estrella"></div>
    <h1>República de Esperanza</h1>
    <p>Redirigiendo al sitio en español…</p>
    <p>Si no redirige automáticamente, elige un idioma:</p>
    <div class="langs">
      <a href="/es/">🇩🇴 Español</a>
      <a href="/en/">🇺🇸 English</a>
      <a href="/ht/">🇭🇹 Kreyòl</a>
    </div>
  </div>
</body>
</html>
