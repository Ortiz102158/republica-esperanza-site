backend:
  name: git-gateway
  branch: periodico
  base: periodico
media_folder: "static/img"
public_folder: "/img"

locale: "es"

collections:
  - name: "actualidad"
    label: "Actualidad"
    folder: "content/actualidad"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Autor", name: "autor", widget: "string", default: "MSR" }
      - { label: "Sección", name: "seccion", widget: "string", default: "Actualidad" }
      - { label: "Tipo", name: "tipo", widget: "select", options: ["articulo", "editorial", "analisis", "ensayo", "documento", "opinion"], default: "articulo" }
      - { label: "Resumen", name: "summary", widget: "text", required: false, hint: "Breve descripcion (2-3 lineas)" }
      - { label: "Contenido", name: "body", widget: "markdown" }

