{{ define "main" }}
<section class="seccion">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="descripcion">{{ . }}</p>{{ end }}
  {{ range .Pages.ByDate.Reverse }}
    <article class="articulo-resumen">
      <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      <div class="meta">
        {{ if .Params.autor }}Por {{ .Params.autor }} | {{ end }}
        {{ partial "fecha.html" . }}
      </div>
      <p>{{ .Summary }}</p>
    </article>
  {{ end }}
</section>
{{ end }}
